<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Detector | Team Fuzion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00b4d8;
            --dark: #0f0f1f;
        }

        body {
            background: linear-gradient(45deg, var(--dark), #1a1a2f);
            color: #fff;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .main-title {
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 300px;
        }

        .upload-area:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .preview-image {
            border-radius: 15px;
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #000;
        }

        .processing-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin: 20px 0;
        }

        .processing-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            animation: processing 2s infinite;
        }

        @keyframes processing {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .result-box {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .team-footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            opacity: 0.8;
            animation: fadeIn 1s 1s forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 0.8; }
        }

        .mesh-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .real-badge {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid var(--primary);
        }

        .fake-badge {
            background: rgba(255, 0, 100, 0.2);
            border: 2px solid #ff0064;
        }
    </style>
</head>
<body class="d-flex flex-column">
    <div class="container my-5">
        <h1 class="main-title text-center mb-5">DeepFake Detection System</h1>

        <div class="glass-card p-5 mb-5">
            <div id="upload-section" class="text-center">
                <input type="file" id="imageInput" hidden accept="image/*">
                <div class="upload-area d-flex flex-column justify-content-center" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt fa-3x mb-3" style="color: var(--primary);"></i>
                    <h2 class="mb-3">Drag & Drop or Click to Upload</h2>
                    <p class="text-muted">Supported formats: JPEG, PNG</p>
                </div>
            </div>

            <div id="processing-section" class="d-none">
                <div class="processing-bar">
                    <div class="processing-fill"></div>
                </div>
                <p class="text-center mb-0">Analyzing image...</p>
            </div>

            <div id="result-section" class="row mt-4 g-4 d-none">
                <div class="col-md-6">
                    <div class="position-relative">
                        <img id="originalPreview" class="preview-image" alt="Original">
                        <canvas class="mesh-overlay"></canvas>
                    </div>
                    <p class="text-center mt-2">Original Image</p>
                </div>

                <div class="col-md-6">
                    <div class="position-relative">
                        <img id="processedPreview" class="preview-image" alt="Processed">
                        <canvas class="mesh-overlay"></canvas>
                    </div>
                    <p class="text-center mt-2">Analysis Result</p>
                </div>

                <div class="col-12">
                    <div id="resultText" class="result-box text-center p-3 rounded">
                        <h2 class="mb-0">Analysis Result</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="team-footer text-center">
        🚀 Innovated by <span class="fw-bold" style="color: var(--primary);">Team Fuzion</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const resultSection = document.getElementById('result-section');
        const resultText = document.getElementById('resultText');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Show processing
                uploadSection.classList.add('d-none');
                processingSection.classList.remove('d-none');
                resultSection.classList.add('d-none');

                const reader = new FileReader();
                reader.onload = function(e) {
                    // Set original preview
                    const originalPreview = document.getElementById('originalPreview');
                    originalPreview.src = e.target.result;

                    // Simulate processing delay
                    setTimeout(() => {
                        // Set processed preview (same for simulation)
                        document.getElementById('processedPreview').src = e.target.result;
                        
                        // Show results
                        processingSection.classList.add('d-none');
                        resultSection.classList.remove('d-none');
                        
                        // Simulate mesh drawing
                        drawMesh();
                        
                        // Show result text
                        showResult();
                    }, 2500);
                };
                reader.readAsDataURL(file);
            }
        });

        function drawMesh() {
            // Simulate face mesh drawing on both canvases
            document.querySelectorAll('.mesh-overlay').forEach(canvas => {
                const ctx = canvas.getContext('2d');
                canvas.width = 500;
                canvas.height = 400;
                
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                
                // Draw random mesh
                for(let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 500, Math.random() * 400);
                    ctx.lineTo(Math.random() * 500, Math.random() * 400);
                    ctx.stroke();
                }
            });
        }

        function showResult() {
            // Simulate API response
            const isReal = Math.random() > 0.5;
            resultText.innerHTML = `
                <div class="${isReal ? 'real-badge' : 'fake-badge'} p-3 rounded-pill">
                    <h2 class="mb-0">${isReal ? '✅ Real Image' : '❌ AI Generated'}</h2>
                    <p class="mb-0 mt-2">Confidence: ${(Math.random() * 100).toFixed(1)}%</p>
                </div>
            `;
            resultText.style.opacity = '1';
            resultText.style.transform = 'translateY(0)';
        }
    </script>
</body>
</html>
