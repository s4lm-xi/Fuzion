<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Detector | Team Fuzion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00b4d8;
            --dark: #0f0f1f;
        }

        body {
            background: linear-gradient(45deg, var(--dark), #1a1a2f);
            color: #fff;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 300;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            margin: 2rem 0;
            position: relative;
            z-index: 2;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 300px;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }

        .preview-image {
            border-radius: 15px;
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #000;
        }

        .processing-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 30px 0;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .processing-fill {
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(0, 255, 136, 0.8),
                rgba(0, 180, 216, 0.8));
            width: 45%;
            border-radius: 4px;
            animation: processing 2s ease-in-out infinite;
            position: relative;
        }

        .processing-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent);
            animation: shine 1.5s ease-in-out infinite;
        }

        @keyframes processing {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(200%); }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .result-box {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .team-footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            opacity: 0.8;
            animation: fadeIn 1s 1s forwards;
            opacity: 0;
            z-index: 3;
        }

        @keyframes fadeIn {
            to { opacity: 0.8; }
        }

        .mesh-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .real-badge {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid var(--primary);
        }

        .fake-badge {
            background: rgba(255, 0, 100, 0.2);
            border: 2px solid #ff0064;
        }

        .progress-percent {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ff88;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="d-flex flex-column">
    <div class="container my-5">
        <header class="header text-center">
            <h1 class="main-title">DeepFake Detector</h1>
            <p class="text-muted">Advanced AI-powered image authenticity verification</p>
        </header>

        <div class="glass-card p-5 mb-5">
            <div id="upload-section" class="text-center">
                <input type="file" id="imageInput" hidden accept="image/*">
                <div class="upload-area d-flex flex-column justify-content-center" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt fa-3x mb-3" style="color: var(--primary);"></i>
                    <h2 class="mb-3">Drag & Drop or Click to Upload</h2>
                    <p class="text-muted">Supported formats: JPEG, PNG</p>
                </div>
            </div>

            <div id="processing-section" class="d-none">
                <div class="processing-bar">
                    <div class="processing-fill"></div>
                    <span class="progress-percent">45%</span>
                </div>
                <p class="text-center mb-0">Analyzing image...</p>
            </div>

            <div id="result-section" class="row mt-4 g-4 d-none">
                <div class="col-md-6">
                    <div class="position-relative">
                        <img id="originalPreview" class="preview-image" alt="Original">
                        <canvas class="mesh-overlay"></canvas>
                    </div>
                    <p class="text-center mt-2">Original Image</p>
                </div>

                <div class="col-md-6">
                    <div class="position-relative">
                        <img id="processedPreview" class="preview-image" alt="Processed">
                        <canvas class="mesh-overlay"></canvas>
                    </div>
                    <p class="text-center mt-2">Analysis Result</p>
                </div>

                <div class="col-12">
                    <div id="resultText" class="result-box text-center p-3 rounded">
                        <h2 class="mb-0">Analysis Result</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="team-footer text-center">
        🚀 Innovated by <span class="fw-bold" style="color: var(--primary);">Team Fuzion</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadSection = document.getElementById('upload-section');
        const processingSection = document.getElementById('processing-section');
        const resultSection = document.getElementById('result-section');
        const resultText = document.getElementById('resultText');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadSection.classList.add('d-none');
                processingSection.classList.remove('d-none');
                resultSection.classList.add('d-none');
                simulateProgress();

                const reader = new FileReader();
                reader.onload = function(e) {
                    const originalPreview = document.getElementById('originalPreview');
                    originalPreview.src = e.target.result;

                    setTimeout(() => {
                        document.getElementById('processedPreview').src = e.target.result;
                        processingSection.classList.add('d-none');
                        resultSection.classList.remove('d-none');
                        drawMesh();
                        showResult();
                    }, 2500);
                };
                reader.readAsDataURL(file);
            }
        });

        function drawMesh() {
            document.querySelectorAll('.mesh-overlay').forEach(canvas => {
                const ctx = canvas.getContext('2d');
                canvas.width = 500;
                canvas.height = 400;
                
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                
                for(let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 500, Math.random() * 400);
                    ctx.lineTo(Math.random() * 500, Math.random() * 400);
                    ctx.stroke();
                }
            });
        }

        function showResult() {
            const isReal = Math.random() > 0.5;
            resultText.innerHTML = `
                <div class="${isReal ? 'real-badge' : 'fake-badge'} p-3 rounded-pill">
                    <h2 class="mb-0">${isReal ? '✅ Real Image' : '❌ AI Generated'}</h2>
                    <p class="mb-0 mt-2">Confidence: ${(Math.random() * 100).toFixed(1)}%</p>
                </div>
            `;
            resultText.style.opacity = '1';
            resultText.style.transform = 'translateY(0)';
        }

        function simulateProgress() {
            let percent = 0;
            const counter = document.querySelector('.progress-percent');
            const interval = setInterval(() => {
                percent += Math.random() * 3;
                if(percent >= 100) {
                    percent = 100;
                    clearInterval(interval);
                }
                counter.textContent = `${Math.min(100, Math.floor(percent))}%`;
            }, 100);
        }

        // Drag and drop functionality
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.querySelector('.upload-area').style.borderColor = var(--primary);
        });

        document.addEventListener('dragleave', () => {
            document.querySelector('.upload-area').style.borderColor = 'rgba(255, 255, 255, 0.2)';
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            imageInput.files = e.dataTransfer.files;
            const event = new Event('change');
            imageInput.dispatchEvent(event);
        });
    </script>
</body>
</html>
