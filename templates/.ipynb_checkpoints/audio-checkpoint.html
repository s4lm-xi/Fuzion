<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFake Audio Detector | Team Fuzion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="d-flex flex-column">
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">DeepFake Detector</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">Video DeepFake Detection</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    <header class="header text-center">
      <h1 class="main-title">DeepFake Audio Detector</h1>
      <p class="text">Advanced AI-powered audio authenticity verification</p>
    </header>
    <div class="glass-card p-5 mb-5">
      <!-- Upload Section -->
      <div id="upload-section" class="text-center">
        <input type="file" id="audioInput" hidden accept="audio/*" />
        <div class="upload-area d-flex flex-column justify-content-center" onclick="document.getElementById('audioInput').click()">
          <i class="fas fa-microphone fa-3x mb-3" style="color: var(--primary);"></i>
          <h2 class="mb-3">Drag & Drop or Click to Upload Audio</h2>
          <p class="text">Supported formats: MP3, WAV</p>
        </div>
      </div>
      <!-- Processing Section with Spinner -->
      <div id="processing-section" class="d-none text-center">
        <div id="loading-spinner" class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Analyzing audio...</p>
      </div>
      <!-- Result Section -->
      <div id="result-section" class="d-none">
        <!-- Audio Player -->
        <div class="row mt-4">
          <div class="col-12 text-center">
            <audio id="audioPlayer" controls style="width: 100%;"></audio>
            <p class="mt-2">Uploaded Audio</p>
          </div>
        </div>
        <!-- Spectrogram Image -->
        <div class="row mt-4">
          <div class="col-12 text-center">
            <img id="spectrogramImage" class="img-fluid rounded" alt="Spectrogram" style="max-width:600px;">
            <p class="mt-2">Spectrogram</p>
          </div>
        </div>
        <!-- Prediction Result -->
        <div class="row mt-4">
          <div class="col-12 text-center">
            <div id="predictionText" class="result-box p-3 rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="team-footer text-center">
    🚀 Innovated by <span class="fw-bold" style="color: var(--primary);">Team Fuzion</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const audioInput = document.getElementById('audioInput');
    const uploadSection = document.getElementById('upload-section');
    const processingSection = document.getElementById('processing-section');
    const resultSection = document.getElementById('result-section');
    const audioPlayer = document.getElementById('audioPlayer');
    const spectrogramImage = document.getElementById('spectrogramImage');
    const predictionText = document.getElementById('predictionText');

    audioInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            uploadSection.classList.add('d-none');
            processingSection.classList.remove('d-none');
            resultSection.classList.add('d-none');

            const formData = new FormData();
            formData.append("audio", file);

            fetch('/upload_audio', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(() => {
                    if (data.error) {
                        alert(data.error);
                        processingSection.classList.add('d-none');
                        uploadSection.classList.remove('d-none');
                        return;
                    }

                    spectrogramImage.src = data.spectrogram_url;
                    audioPlayer.src = data.audio_url; // Ensure audio file is playable
                    audioPlayer.load(); // Reload audio in case of caching issues

                    let resultHTML = '';
                    if (data.prediction === 1) {
                        resultHTML = `<div class="real-badge p-3 rounded-pill">
                                        <h2 class="mb-0">✅ Real Audio</h2>
                                        <p class="mb-0 mt-2">Confidence: ${data.confidence}%</p>
                                      </div>`;
                    } else {
                        resultHTML = `<div class="fake-badge p-3 rounded-pill">
                                        <h2 class="mb-0">❌ Fake Audio</h2>
                                        <p class="mb-0 mt-2">Confidence: ${data.confidence}%</p>
                                      </div>`;
                    }
                    predictionText.innerHTML = resultHTML;
                    predictionText.style.opacity = '1';
                    predictionText.style.transform = 'translateY(0)';
                    processingSection.classList.add('d-none');
                    resultSection.classList.remove('d-none');
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                processingSection.classList.add('d-none');
                uploadSection.classList.remove('d-none');
                alert('Error processing audio');
            });
        }
    });
</script>


</body>
</html>
