<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFake Video Detector | Team Fuzion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="d-flex flex-column">
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">DeepFake Detector</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('audio_page') }}">Audio DeepFake Detection</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <header class="header text-center">
      <h1 class="main-title">DeepFake Video Detector</h1>
      <p class="text">Advanced AI-powered video authenticity verification</p>
    </header>
    <div class="glass-card p-5 mb-5">
      <!-- Upload Section -->
      <div id="upload-section" class="text-center">
        <input type="file" id="videoInput" hidden accept="video/mp4" />
        <div class="upload-area d-flex flex-column justify-content-center" onclick="document.getElementById('videoInput').click()">
          <i class="fas fa-video fa-3x mb-3" style="color: var(--primary);"></i>
          <h2 class="mb-3">Drag & Drop or Click to Upload Video</h2>
          <p class="text">Supported format: MP4</p>
        </div>
      </div>
      <!-- Processing Section with Spinner -->
      <div id="processing-section" class="d-none text-center">
        <div id="loading-spinner" class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Analyzing video...</p>
      </div>
      <!-- Result Section -->
      <div id="result-section" class="d-none">
        <!-- Original Video -->
        <div class="row mt-4">
          <div class="col-12 text-center">
            <video id="originalVideo" controls style="max-width:100%;"></video>
            <p class="mt-2">Original Video</p>
          </div>
        </div>
        <!-- Face ROI Images -->
        <div class="row mt-4" id="roiSection">
          <!-- ROI images will be appended here -->
        </div>
        <!-- Prediction Result -->
        <div class="row mt-4">
          <div class="col-12 text-center">
            <div id="predictionText" class="result-box p-3 rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="team-footer text-center">
    🚀 Innovated by <span class="fw-bold" style="color: var(--primary);">Team Fuzion</span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const videoInput = document.getElementById('videoInput');
    const uploadSection = document.getElementById('upload-section');
    const processingSection = document.getElementById('processing-section');
    const resultSection = document.getElementById('result-section');
    const originalVideo = document.getElementById('originalVideo');
    const predictionText = document.getElementById('predictionText');
    const roiSection = document.getElementById('roiSection');

    videoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            uploadSection.classList.add('d-none');
            processingSection.classList.remove('d-none');
            resultSection.classList.add('d-none');

            const reader = new FileReader();
            reader.onload = function(event) {
                originalVideo.src = event.target.result;

                const formData = new FormData();
                formData.append('video', file);

                fetch('/upload_video', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    setTimeout(() => {
                        roiSection.innerHTML = '';

                        // Check if rois are provided and display them
                        if (data.rois) {
                            data.rois.forEach(roi => {
                                const colDiv = document.createElement('div');
                                colDiv.className = 'col-md-2 col-4 mb-3';
                                const img = document.createElement('img');
                                img.src = roi;
                                img.className = 'img-fluid rounded';
                                colDiv.appendChild(img);
                                roiSection.appendChild(colDiv);
                            });
                        }

                        let resultHTML = '';
                        if (data.prediction !== undefined && data.confidence !== undefined) {
                            console.log(data.prediction)
                            if (data.prediction === 1) {
                                resultHTML = `<div class="real-badge p-3 rounded-pill">
                                                <h2 class="mb-0">✅ Real Video</h2>
                                                <p class="mb-0 mt-2">Confidence: ${data.confidence}%</p>
                                              </div>`;
                            } else {
                                resultHTML = `<div class="fake-badge p-3 rounded-pill">
                                                <h2 class="mb-0">❌ Fake Video</h2>
                                                <p class="mb-0 mt-2">Confidence: ${data.confidence}%</p>
                                              </div>`;
                            }
                        } else {
                            resultHTML = `<div class="error-badge p-3 rounded-pill">
                                            <h2 class="mb-0">Error: Prediction or Confidence not found</h2>
                                          </div>`;
                        }

                        // Debugging log to check what's being returned
                        console.log('Prediction HTML:', resultHTML);

                        predictionText.innerHTML = resultHTML;
                        predictionText.style.opacity = '1';
                        processingSection.classList.add('d-none');
                        resultSection.classList.remove('d-none');
                    }, 1000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    processingSection.classList.add('d-none');
                    uploadSection.classList.remove('d-none');
                    alert('Error processing video');
                });
            };
            reader.readAsDataURL(file);
        }
    });
</script>



</body>
</html>
